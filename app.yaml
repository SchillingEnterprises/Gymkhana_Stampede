runtime: python312
entrypoint: gunicorn -b :$PORT KDF.wsgi:application

# Collect static assets before deploying:
#   python KDF/manage.py collectstatic --noinput
handlers:
  - url: /static
    static_dir: KDF/staticfiles
    secure: always
  - url: /.*
    script: auto
    secure: always

env_variables:
  DJANGO_DEBUG: "false"
  DJANGO_DB_ENGINE: "postgresql"
  DJANGO_TRUST_PROXY: "true"
  DJANGO_SECURE_SSL_REDIRECT: "true"
  DJANGO_SESSION_COOKIE_SECURE: "true"
  DJANGO_CSRF_COOKIE_SECURE: "true"

# For Cloud SQL, configure the instance connection name here after provisioning:
# beta_settings:
#   cloud_sql_instances: PROJECT:REGION:INSTANCE

# Set DJANGO_SECRET_KEY, DJANGO_ALLOWED_HOSTS, DJANGO_DB_NAME,
# DJANGO_DB_USER, DJANGO_DB_PASSWORD, and DJANGO_DB_HOST through
# Google Cloud Secret Manager / the deployment environment. Do not commit them.
