name: Gymkhana Stampede source and runtime checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, chore/secure-legacy-django-configuration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gymkhana-source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DJANGO_DB_ENGINE: sqlite
      DJANGO_DATABASE_NAME: "/tmp/gymkhana-ci.sqlite3"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install supported web runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Compile project Python
        run: python -m compileall -q KDF
      - name: Run source-level security and architecture checks
        run: python -m unittest discover -s tests -v
      - name: Run Django system checks
        run: python KDF/manage.py check
      - name: Verify migration state matches models
        run: python KDF/manage.py makemigrations --check --dry-run
      - name: Check production security configuration
        env:
          DJANGO_SECRET_KEY: "ci-only-deployment-check-key-long-enough-for-django-security-validation"
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
          DJANGO_SECURE_SSL_REDIRECT: "true"
          DJANGO_SESSION_COOKIE_SECURE: "true"
          DJANGO_CSRF_COOKIE_SECURE: "true"
          DJANGO_HSTS_SECONDS: "0"
        run: python KDF/manage.py check --deploy --fail-level ERROR
      - name: Migrate a disposable SQLite database
        run: python KDF/manage.py migrate --noinput
      - name: Run Django integration tests
        run: python KDF/manage.py test Derby_Event --verbosity 2
      - name: Collect static assets
        run: python KDF/manage.py collectstatic --noinput
