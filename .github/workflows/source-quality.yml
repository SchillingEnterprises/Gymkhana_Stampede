name: Gymkhana Stampede source checks

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, chore/secure-legacy-django-configuration]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gymkhana-source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v6
        with:
          python-version: "3.12"
      - name: Compile project Python
        run: python -m compileall -q KDF
      - name: Run security configuration checks
        run: python -m unittest discover -s tests -v
